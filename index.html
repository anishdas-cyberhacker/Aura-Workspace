<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura - Intelligent SaaS Project Management Workspace</title>
  
  <!-- Material Symbols Icons & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with custom config matching Stitch design system -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4648d4",
            "primary-container": "#6063ee",
            "on-primary": "#ffffff",
            "on-primary-container": "#fffbff",
            "primary-fixed": "#e1e0ff",
            "primary-fixed-dim": "#c0c1ff",
            "secondary": "#006877",
            "secondary-container": "#3fe1fd",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#00616f",
            "secondary-fixed": "#a2eeff",
            "tertiary": "#904900",
            "tertiary-container": "#b55d00",
            "on-tertiary": "#ffffff",
            "surface": "#f8f9ff",
            "surface-dim": "#cbdbf5",
            "surface-bright": "#f8f9ff",
            "surface-variant": "#d3e4fe",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#464554",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d3e4fe",
            "inverse-surface": "#213145",
            "inverse-on-surface": "#eaf1ff",
            "inverse-primary": "#c0c1ff",
            "outline": "#767586",
            "outline-variant": "#c7c4d7",
            "background": "#f8f9ff",
            "on-background": "#0b1c30",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            "unit": "4px",
            "stack-sm": "8px",
            "stack-md": "16px",
            "stack-lg": "32px",
            "margin-mobile": "16px",
            "margin-desktop": "40px",
            "gutter": "24px",
            "container-max": "1280px"
          },
          fontFamily: {
            "headline-lg": ["Hanken Grotesk", "sans-serif"],
            "headline-md": ["Hanken Grotesk", "sans-serif"],
            "display-lg": ["Hanken Grotesk", "sans-serif"],
            "body-lg": ["Geist", "sans-serif"],
            "body-md": ["Geist", "sans-serif"],
            "label-md": ["Geist", "sans-serif"],
            "label-sm": ["Geist", "sans-serif"]
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Global Modal Overlay Container -->
  <div id="modal-container" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200"></div>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
